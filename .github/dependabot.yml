version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # The msrv job pins this action to the rust-version in Cargo.toml.
      # Bumping it would silently stop testing the MSRV.
      - dependency-name: dtolnay/rust-toolchain
